<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Khane Ki Khoj</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand">
        <div class="brand-icon-box">🍱</div>
        <div class="brand-text">
          <h1>Khane Ki Khoj</h1>
          <span>Home-Style Tiffin Services</span>
        </div>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="student-dashboard.html">Browse Tiffins</a></li>
      </ul>
      <div class="nav-actions" id="nav-actions">
        <a href="register.html" class="btn btn-primary btn-sm">Sign Up</a>
      </div>
    </div>
  </header>

  <!-- Login Two-Column Card -->
  <main class="auth-page-wrapper">
    <div class="auth-split-card">
      <!-- Left Column: Indian Food Photography with Overlay -->
      <div class="auth-split-image">
        <img src="https://images.unsplash.com/photo-1546833999-b9f581a1996d?w=800&auto=format&fit=crop&q=80" alt="Indian Home Cooked Tiffin">
        <div class="auth-image-overlay">
          <div class="auth-image-quote">"Good Food Good Mood"</div>
          <div class="auth-image-sub">Wholesome student tiffins delivered fresh daily.</div>
        </div>
      </div>

      <!-- Right Column: Login Card -->
      <div class="auth-form-column">
        <div class="auth-header">
          <h2>Welcome Back</h2>
          <p>Your next home-style meal is waiting.</p>
        </div>

        <!-- Quick Demo Access for Evaluation -->
        <div class="demo-credentials-box">
          <div style="font-weight: 700; color: var(--text-main); margin-bottom: 2px;">⚡ Quick Demo Login:</div>
          <div class="demo-btn-group">
            <button type="button" class="btn btn-secondary btn-sm" onclick="fillDemo('aarav_student', 'password123')">Student</button>
            <button type="button" class="btn btn-secondary btn-sm" onclick="fillDemo('annapurna_tiffin', 'password123')">Provider</button>
          </div>
        </div>

        <div id="login-error-alert" class="toast toast-error" style="display:none; position:static; animation:none; min-width:auto; margin-bottom:16px;"></div>

        <form id="login-form">
          <div class="filter-group" style="margin-bottom: 16px;">
            <label for="username_or_email">Email or Username</label>
            <input type="text" id="username_or_email" class="form-control" placeholder="Enter your email or username" required>
          </div>

          <div class="filter-group" style="margin-bottom: 12px;">
            <label for="password">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
          </div>

          <div style="display: flex; justify-content: flex-end; margin-bottom: 20px;">
            <a href="reset-password.html" style="font-size: 13px; font-weight: 600; color: var(--accent-green);">Forgot Password?</a>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 15px;">
            Login
          </button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-muted);">
          New here? <a href="register.html" style="font-weight: 700; color: var(--accent-green);">Create an account</a>
        </div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function fillDemo(username, password) {
      document.getElementById('username_or_email').value = username;
      document.getElementById('password').value = password;
      showToast(`Filled demo credentials for ${username}`, "info");
    }
  </script>
</body>
</html>
