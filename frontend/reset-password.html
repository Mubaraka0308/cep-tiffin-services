<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password – CEP Tiffin Services</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
        body { background: var(--light); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .reset-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
            padding: 2.5rem 2rem;
            max-width: 420px;
            width: 100%;
        }
        .reset-card h2 { color: var(--primary); margin-bottom: 0.25rem; }
        .reset-card p.subtitle { color: #666; font-size: 0.95rem; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.4rem; color: #333; }
        .form-group input {
            width: 100%; padding: 0.65rem 0.9rem;
            border: 1.5px solid #ddd; border-radius: 8px;
            font-size: 1rem; transition: border-color 0.2s;
            box-sizing: border-box;
        }
        .form-group input:focus { outline: none; border-color: var(--primary); }
        .btn-primary {
            width: 100%; padding: 0.75rem;
            background: var(--primary); color: #fff;
            border: none; border-radius: 8px;
            font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: background 0.2s;
        }
        .btn-primary:hover { background: var(--primary-dark, #e05a00); }
        .alert { padding: 0.85rem 1rem; border-radius: 8px; font-size: 0.95rem; margin-bottom: 1rem; display: none; }
        .alert-success { background: #e6f9ed; color: #1a7a3c; border: 1px solid #b2e0c5; }
        .alert-error   { background: #fdecea; color: #b71c1c; border: 1px solid #f5c6cb; }
        .back-link { display: block; text-align: center; margin-top: 1.2rem; color: var(--primary); font-size: 0.93rem; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
        .logo { text-align: center; margin-bottom: 1.5rem; font-size: 1.5rem; font-weight: 700; color: var(--primary); }
    </style>
</head>
<body>
    <div class="reset-card">
        <div class="logo">🍱 Tiffin Services</div>

        <!-- ====== STEP 1: enter email ====== -->
        <div id="step-email">
            <h2>Forgot Password?</h2>
            <p class="subtitle">Enter your registered email address and we'll send you a reset link.</p>
            <div id="alert-email" class="alert"></div>
            <form id="forgot-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com" required />
                </div>
                <button type="submit" class="btn-primary">Send Reset Link</button>
            </form>
            <a href="/login.html" class="back-link">← Back to Login</a>
        </div>

        <!-- ====== STEP 2: enter new password (shown when ?token= is in URL) ====== -->
        <div id="step-reset" style="display:none;">
            <h2>Set New Password</h2>
            <p class="subtitle">Choose a strong new password for your account.</p>
            <div id="alert-reset" class="alert"></div>
            <form id="reset-form">
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" placeholder="Min 6 characters" minlength="6" required />
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" placeholder="Repeat new password" required />
                </div>
                <button type="submit" class="btn-primary">Reset Password</button>
            </form>
            <a href="/login.html" class="back-link">← Back to Login</a>
        </div>
    </div>

    <script>
        const API = '/api/auth';

        function showAlert(id, msg, type) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.className = `alert alert-${type}`;
            el.style.display = 'block';
        }

        // Detect token in URL → show step 2
        const params = new URLSearchParams(window.location.search);
        const resetToken = params.get('token');
        if (resetToken) {
            document.getElementById('step-email').style.display = 'none';
            document.getElementById('step-reset').style.display = 'block';
        }

        // ── Step 1: Request reset link ──
        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.textContent = 'Sending…';

            try {
                const res = await fetch(`${API}/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                if (res.ok) {
                    showAlert('alert-email', data.message, 'success');
                    // In dev mode the reset URL is printed in the backend console.
                    // In production, the user receives an actual email.
                } else {
                    showAlert('alert-email', data.detail || 'Something went wrong.', 'error');
                }
            } catch {
                showAlert('alert-email', 'Network error. Please try again.', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send Reset Link';
            }
        });

        // ── Step 2: Submit new password ──
        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (newPassword !== confirmPassword) {
                showAlert('alert-reset', 'Passwords do not match.', 'error');
                return;
            }

            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.textContent = 'Resetting…';

            try {
                const res = await fetch(`${API}/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: resetToken, new_password: newPassword })
                });
                const data = await res.json();
                if (res.ok) {
                    showAlert('alert-reset', data.message + ' Redirecting to login…', 'success');
                    setTimeout(() => { window.location.href = '/login.html'; }, 2500);
                } else {
                    showAlert('alert-reset', data.detail || 'Reset failed. The link may have expired.', 'error');
                }
            } catch {
                showAlert('alert-reset', 'Network error. Please try again.', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
