<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Khane Ki Khoj</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .reg-card {
      width: 100%;
      max-width: 640px;
      background: var(--bg-surface);
      border: 1px solid var(--border-warm);
      border-radius: var(--radius-lg);
      padding: 40px 36px;
      box-shadow: var(--shadow-lg);
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand">
        <div class="brand-icon-box">🍱</div>
        <div class="brand-text">
          <h1>Khane Ki Khoj</h1>
          <span>Home-Style Tiffin Services</span>
        </div>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="student-dashboard.html">Browse Tiffins</a></li>
      </ul>
      <div class="nav-actions" id="nav-actions">
        <a href="login.html" class="btn btn-secondary btn-sm">Login</a>
      </div>
    </div>
  </header>

  <!-- Register Main -->
  <main class="auth-page-wrapper">
    <div class="reg-card">
      <div class="auth-header" style="text-align: center; margin-bottom: 24px;">
        <h2>Join Khane Ki Khoj</h2>
        <p>Choose your role and start your journey.</p>
      </div>

      <!-- Role Selection Cards from Figma Reference -->
      <div class="role-cards-container">
        <!-- Student Option -->
        <label class="role-card-option selected" id="label-student">
          <input type="radio" name="role" id="role-student" value="student" checked>
          <div class="role-card-avatar">🎓</div>
          <div class="role-card-title">Student</div>
          <div class="role-card-desc">Find and subscribe to local tiffin services.</div>
        </label>

        <!-- Provider Option -->
        <label class="role-card-option" id="label-provider">
          <input type="radio" name="role" id="role-provider" value="provider">
          <div class="role-card-avatar">🧑‍🍳</div>
          <div class="role-card-title">Provider</div>
          <div class="role-card-desc">Share your homemade meals with students.</div>
        </label>
      </div>

      <div id="register-error-alert" class="toast toast-error" style="display:none; position:static; animation:none; min-width:auto; margin-bottom:18px;"></div>

      <form id="register-form">
        <div class="filter-group" style="margin-bottom: 14px;">
          <label for="reg-name">Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="e.g. Aarav Sharma or Sunita Deshmukh" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px;">
          <div class="filter-group">
            <label for="reg-email">Email Address</label>
            <input type="email" id="reg-email" class="form-control" placeholder="name@college.edu" required>
          </div>
          <div class="filter-group">
            <label for="reg-username">Username</label>
            <input type="text" id="reg-username" class="form-control" placeholder="username" required>
          </div>
        </div>

        <div class="filter-group" style="margin-bottom: 14px;">
          <label for="reg-phone">Phone / WhatsApp Number</label>
          <input type="tel" id="reg-phone" class="form-control" placeholder="e.g. 9823011223" required>
        </div>

        <!-- Dynamic Student Fields -->
        <div id="student-fields" style="background: var(--bg-subtle); padding: 18px; border-radius: var(--radius-sm); border: 1px solid var(--border-warm); margin-bottom: 16px;">
          <h4 style="font-size: 12px; color: var(--accent-green-dark); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 800; margin-bottom: 12px;">Student Details</h4>
          <div class="filter-group" style="margin-bottom: 12px;">
            <label for="reg-college">College / University Name</label>
            <input type="text" id="reg-college" class="form-control" placeholder="e.g. PIET / MIT Pune / Bharati Vidyapeeth">
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div class="filter-group">
              <label for="reg-area">Hostel / Staying Area</label>
              <select id="reg-area" class="form-control">
                <option value="Dhankawadi">Dhankawadi</option>
                <option value="Sarita Vihar">Sarita Vihar</option>
                <option value="Katraj">Katraj</option>
                <option value="Bibwewadi">Bibwewadi</option>
                <option value="Other Area, Pune">Other Area, Pune</option>
              </select>
            </div>
            <div class="filter-group">
              <label for="reg-preference">Meal Preference</label>
              <select id="reg-preference" class="form-control">
                <option value="veg">Pure Veg</option>
                <option value="both">Veg & Non-Veg</option>
                <option value="jain">Jain Available</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Dynamic Provider Fields -->
        <div id="provider-fields" style="display: none; background: var(--bg-subtle); padding: 18px; border-radius: var(--radius-sm); border: 1px solid var(--border-warm); margin-bottom: 16px;">
          <h4 style="font-size: 12px; color: #9A3412; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 800; margin-bottom: 12px;">Tiffin Service Details</h4>
          <div class="filter-group" style="margin-bottom: 12px;">
            <label for="reg-service-name">Service / Mess Name</label>
            <input type="text" id="reg-service-name" class="form-control" placeholder="e.g. Annapurna Tiffin Services">
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
            <div class="filter-group">
              <label for="reg-provider-area">Operating Area (Pune)</label>
              <input type="text" id="reg-provider-area" class="form-control" placeholder="e.g. Dhankawadi, Pune">
            </div>
            <div class="filter-group">
              <label for="reg-food-type">Food Type</label>
              <select id="reg-food-type" class="form-control">
                <option value="Pure Veg">Pure Veg</option>
                <option value="Veg & Non-Veg">Veg & Non-Veg</option>
                <option value="Jain Available">Jain Available</option>
              </select>
            </div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div class="filter-group">
              <label for="reg-meal-price">Single Meal (₹)</label>
              <input type="number" id="reg-meal-price" class="form-control" value="80" min="40" max="250">
            </div>
            <div class="filter-group">
              <label for="reg-monthly-price">Monthly Plan (₹)</label>
              <input type="number" id="reg-monthly-price" class="form-control" value="2400" min="1000" max="6000">
            </div>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 22px;">
          <div class="filter-group">
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" class="form-control" placeholder="Min. 6 characters" required>
          </div>
          <div class="filter-group">
            <label for="reg-confirm-password">Confirm Password</label>
            <input type="password" id="reg-confirm-password" class="form-control" placeholder="Repeat password" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 15px;">
          Register
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-muted);">
        Already have an account? <a href="login.html" style="font-weight: 700; color: var(--accent-green);">Login</a>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Role selection highlight toggle
    const rStudent = document.getElementById("role-student");
    const rProvider = document.getElementById("role-provider");
    const lblStudent = document.getElementById("label-student");
    const lblProvider = document.getElementById("label-provider");

    function syncRoleUI() {
      if (rStudent.checked) {
        lblStudent.classList.add("selected");
        lblProvider.classList.remove("selected");
      } else {
        lblProvider.classList.add("selected");
        lblStudent.classList.remove("selected");
      }
    }

    rStudent.addEventListener("change", syncRoleUI);
    rProvider.addEventListener("change", syncRoleUI);

    // Preselect role if query param role=provider
    const params = new URLSearchParams(window.location.search);
    if (params.get("role") === "provider") {
      rProvider.checked = true;
      syncRoleUI();
      rProvider.dispatchEvent(new Event("change"));
    }
  </script>
</body>
</html>
